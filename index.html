<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Waypoints</title>
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png" />
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png" />

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <!-- Leaflet.markercluster -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

  <!-- Type: humanist serif with cartographic pedigree -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Map surface -->
  <div id="map" aria-label="Waypoints map"></div>

  <!-- Paper-grain + vignette overlays (the analog answer to CRT scanlines) -->
  <div class="paper-grain" aria-hidden="true"></div>
  <div class="map-vignette" aria-hidden="true"></div>

  <!-- Top-left: title + tagline (hidden on small screens) and the flag strip -->
  <div class="top-left">
    <header class="masthead">
      <h1>Waypoints</h1>
      <p class="masthead__sub">A gathering of places</p>
    </header>
    <nav class="region-control" id="region-control" aria-label="Region flags"></nav>
  </div>

  <!-- Top right: the Legend, collapsed to a toggle until clicked -->
  <div class="key-box">
    <button class="key-toggle" id="key-toggle" type="button" aria-expanded="false" aria-controls="legend">
      Legend <span class="key-toggle__chev" aria-hidden="true">▾</span>
    </button>
    <aside class="legend" id="legend" aria-label="Legend and filters" hidden></aside>
  </div>

  <!-- Bottom-left: Add Waypoint over Recently added -->
  <div class="lower-left">
    <div class="lower-left__stack">
      <button class="add-waypoint" id="add-waypoint" type="button"
              aria-label="Add new waypoint" title="Add new waypoint">
        <svg class="aw-frame" viewBox="0 0 172 52" preserveAspectRatio="none" aria-hidden="true">
          <path class="aw-corners" d="M3 17 V8 Q3 3 8 3 H17 M155 3 H164 Q169 3 169 8 V17 M169 35 V44 Q169 49 164 49 H155 M17 49 H8 Q3 49 3 44 V35" />
        </svg>
        <svg class="aw-plus" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5 V21.5 M2.5 12 H21.5" /></svg>
        <span class="aw-lbl">Add Waypoint</span>
      </button>
      <aside class="legend recents" id="recents" aria-label="Recently added" hidden></aside>
    </div>
  </div>

  <!-- Side panel (desktop drawer / mobile bottom sheet) -->
  <section class="panel" id="panel" aria-hidden="true" aria-label="Place details" tabindex="-1">
    <div class="panel__handle" aria-hidden="true"></div>
    <button class="panel__close" id="panel-close" aria-label="Close panel">&times;</button>
    <div class="panel__body" id="panel-body"></div>
  </section>
  <div class="panel__backdrop" id="panel-backdrop" hidden></div>

  <!-- Scripts -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Add-waypoint modal -->
  <div class="aw-modal-backdrop" id="aw-backdrop" hidden></div>
  <div class="aw-modal" id="aw-modal" role="dialog" aria-modal="true" aria-labelledby="aw-title" hidden>
    <button class="aw-close" id="aw-close" type="button" aria-label="Close">&times;</button>

    <!-- Step 1: input -->
    <div class="aw-step" id="aw-input-step">
      <h2 class="aw-h" id="aw-title">Add a waypoint</h2>
      <p class="aw-sub">Drop an image, paste a link, or just describe a place. Claude fills in the rest.</p>

      <div class="aw-drop" id="aw-drop" tabindex="0" role="button" aria-label="Upload or drop an image">
        <input type="file" id="aw-file" accept="image/*" hidden>
        <div class="aw-drop-inner" id="aw-drop-inner">
          <span class="aw-drop-icon">⤓</span>
          <span class="aw-drop-text">Drop an image here, or click to upload</span>
        </div>
      </div>

      <div class="aw-or"><span>or</span></div>

      <textarea id="aw-text" class="aw-text" rows="3"
        placeholder="Paste a link, or describe a place — e.g. “Ian Curtis’s grave, Macclesfield”"></textarea>

      <input type="text" id="aw-parent" class="aw-key" list="aw-parent-list"
        placeholder="Nest inside… (optional — type an existing place)" autocomplete="off">
      <datalist id="aw-parent-list"></datalist>

      <input type="password" id="aw-key" class="aw-key" placeholder="Access key" autocomplete="off">

      <div class="aw-actions">
        <button class="aw-btn aw-btn--ghost" id="aw-cancel" type="button">Cancel</button>
        <button class="aw-btn aw-btn--primary" id="aw-draft" type="button">Draft it →</button>
      </div>
      <p class="aw-status" id="aw-status" aria-live="polite"></p>
    </div>

    <!-- Step 2: preview -->
    <div class="aw-step" id="aw-preview-step" hidden>
      <h2 class="aw-h">Look right?</h2>
      <div class="aw-preview" id="aw-preview"></div>
      <div class="aw-actions">
        <button class="aw-btn aw-btn--ghost" id="aw-back" type="button">← Back</button>
        <button class="aw-btn aw-btn--primary" id="aw-commit" type="button">Add to map</button>
      </div>
      <p class="aw-status" id="aw-status2" aria-live="polite"></p>
    </div>
  </div>

  <!-- Feedback tab + window -->
  <!-- Right-edge tabs: Scout Agent card above Feedback -->
  <div class="side-tabs">
    <button class="fb-tab" id="sa-tab" type="button" aria-label="Scout rules" aria-expanded="false" aria-controls="sa-modal">Scout Rules</button>
    <button class="fb-tab" id="fb-tab" type="button" aria-label="Feedback">Feedback</button>
  </div>
  <div class="fb-backdrop" id="sa-backdrop" hidden></div>
  <div class="fb-modal sa-modal" id="sa-modal" role="dialog" aria-modal="true" aria-labelledby="sa-title" tabindex="-1" hidden>
    <button class="aw-close" id="sa-close" type="button" aria-label="Close">&times;</button>
    <div id="sa-body"></div>
  </div>
  <div class="fb-backdrop" id="fb-backdrop" hidden></div>
  <div class="fb-modal" id="fb-modal" role="dialog" aria-modal="true" aria-labelledby="fb-title" hidden>
    <button class="aw-close" id="fb-close" type="button" aria-label="Close">&times;</button>
    <h2 class="aw-h" id="fb-title">Feedback</h2>
    <p class="aw-sub">We're trying to make this better — every note helps. What's this about? (check any)</p>
    <div class="fb-cats">
      <label class="fb-cat"><input type="checkbox" value="broken"> Something's broken / not working</label>
      <label class="fb-cat"><input type="checkbox" value="confusing"> Confusing or hard to use</label>
      <label class="fb-cat"><input type="checkbox" value="howto"> I can't figure out how to do something</label>
      <label class="fb-cat"><input type="checkbox" value="idea"> An idea / would be nice to have</label>
    </div>
    <textarea id="fb-text" class="aw-text" rows="4" maxlength="500" placeholder="Tell us more (optional)…"></textarea>
    <div class="fb-count"><span id="fb-count">0</span>/500</div>
    <div class="aw-actions">
      <button class="aw-btn aw-btn--ghost" id="fb-cancel" type="button">Cancel</button>
      <button class="aw-btn aw-btn--primary" id="fb-submit" type="button">Submit</button>
    </div>
    <p class="aw-status" id="fb-status" aria-live="polite"></p>
  </div>

  <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
  <script src="js/app.js"></script>
  <script src="js/add.js"></script>
  <script src="js/scout-tools.js"></script>
  <script src="js/scout.js"></script>
  <script src="js/scout-card.js"></script>
  <script src="js/inbox.js"></script>
  <script src="js/feedback.js"></script>

  <!-- Default Statcounter code for Waypoints
  https://dgbenner.github.io/waypoints/ -->
  <script type="text/javascript">
  var sc_project=13300534;
  var sc_invisible=1;
  var sc_security="e298c008";
  </script>
  <script type="text/javascript"
  src="https://www.statcounter.com/counter/counter.js"
  async></script>
  <noscript><div class="statcounter"><a title="Web Analytics"
  href="https://statcounter.com/" target="_blank"><img
  class="statcounter"
  src="https://c.statcounter.com/13300534/0/e298c008/1/"
  alt="Web Analytics"
  referrerPolicy="no-referrer-when-downgrade"></a></div></noscript>
  <!-- End of Statcounter Code -->
</body>
</html>
